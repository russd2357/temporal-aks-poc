apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-demo-backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: temporal-backend
        image: pinaruss/temporal-demo-backend
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "0.5"
            memory: "128Mi"
          limits:
            cpu: "1"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-demo-backend
  labels:
    app: backend
spec:
  ports:
  - port: 9099
    targetPort: 9099
  selector:
    app: backend
  type: ClusterIP